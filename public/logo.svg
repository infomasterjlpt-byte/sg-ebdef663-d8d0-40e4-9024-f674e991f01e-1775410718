<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Red rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="18" fill="#cc1f1f"/>

  <!-- Left ear -->
  <ellipse cx="22" cy="52" rx="14" ry="18" fill="#c0c0c0"/>
  <ellipse cx="22" cy="52" rx="9" ry="13" fill="#d8c8c8"/>

  <!-- Right ear -->
  <ellipse cx="78" cy="52" rx="14" ry="18" fill="#c0c0c0"/>
  <ellipse cx="78" cy="52" rx="9" ry="13" fill="#d8c8c8"/>

  <!-- Body -->
  <ellipse cx="50" cy="108" rx="38" ry="30" fill="#d0d0d0"/>

  <!-- Head -->
  <circle cx="50" cy="62" r="32" fill="#d0d0d0"/>

  <!-- Trunk curling up to left -->
  <path d="M 34 80 Q 10 90 6 72 Q 2 54 18 46 Q 26 42 30 50" fill="none" stroke="#c0c0c0" stroke-width="11" stroke-linecap="round"/>
  <path d="M 34 80 Q 10 90 6 72 Q 2 54 18 46 Q 26 42 30 50" fill="none" stroke="#d0d0d0" stroke-width="7" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="38" cy="56" r="5" fill="#333333"/>
  <circle cx="62" cy="56" r="5" fill="#333333"/>
  <circle cx="39" cy="55" r="2" fill="white"/>
  <circle cx="63" cy="55" r="2" fill="white"/>

  <!-- Blush -->
  <ellipse cx="30" cy="68" rx="7" ry="4" fill="#e8a0a0" opacity="0.5"/>
  <ellipse cx="70" cy="68" rx="7" ry="4" fill="#e8a0a0" opacity="0.5"/>

  <!-- Smile -->
  <path d="M 40 76 Q 50 83 60 76" fill="none" stroke="#aaaaaa" stroke-width="2" stroke-linecap="round"/>
</svg>
